[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cem-gauge"
version = "0.1.0"
description = "Gauge analysis package for concept embedding models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
cub = [
  "pillow>=10",
  "torch>=2.1",
  "tqdm>=4.66",
  "transformers>=4.38",
]
tensorboard = ["tensorboard>=2.14"]

[tool.setuptools.package-data]
gauge = ["experiments/configs/datasets/*.json", "experiments/configs/datasets/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
